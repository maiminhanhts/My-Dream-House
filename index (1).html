<!DOCTYPE html><html lang="vi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My Dream House · Writing Adventure</title><style>
:root{--blue:#3269e9;--ink:#183254;--soft:#f2f6ff;--purple:#8059d6;--mint:#22a67f}*{box-sizing:border-box}body{margin:0;font-family:Arial,"Segoe UI",sans-serif;color:var(--ink);background:linear-gradient(145deg,#eaf5ff,#fff7ee)}button,textarea,select{font:inherit}button{border:0;cursor:pointer;border-radius:15px;padding:13px 19px;font-size:20px;font-weight:800}button:focus-visible,.flip:focus-visible{outline:3px solid #ffc600;outline-offset:3px}.primary{background:var(--blue);color:white}.secondary{background:#e6eeff;color:#204d9b}.wrap{max-width:1150px;margin:auto;padding:18px 18px 100px}.hero{border-radius:28px;background:linear-gradient(115deg,#3770df,#a57be8);color:#fff;padding:28px 34px;display:flex;justify-content:space-between;align-items:center;gap:12px}.hero h1{font-size:clamp(33px,4.5vw,52px);margin:8px 0}.hero p{font-size:23px;margin:8px 0}.hero .art{font-size:92px}.progress{background:#dbe7fb;height:14px;border-radius:20px;margin:22px 0 12px;overflow:hidden}.progress div{background:#2cbf98;height:100%;transition:width .3s}.nav{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px}.nav button{background:#e3ecff;color:#2352a0;font-size:16px;padding:11px 15px}.nav button.active{background:var(--blue);color:white}.panel{background:white;border-radius:28px;padding:32px;min-height:450px;box-shadow:0 10px 35px #1c447511}.eyebrow{color:#3d62b9;font-size:17px;font-weight:900;letter-spacing:1.5px}.panel h2{font-size:clamp(30px,4vw,43px);margin:12px 0}.lead{font-size:23px;color:#516786;line-height:1.5}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:16px;margin:20px 0}.choice{border:3px solid #dbe5ff;background:#f2f6ff;color:#1d385c;text-align:left}.choice.sel{border-color:#346be9;background:#deebff}.choice.ok{border-color:#30b88a;background:#dff9eb}.choice.bad{border-color:#e97874;background:#ffe7e5}.feedback,.note{background:#ecf3ff;border-radius:18px;padding:18px 20px;font-size:21px;line-height:1.55;margin:18px 0}.note{background:#f1edff}.row{display:flex;flex-wrap:wrap;gap:12px;align-items:center}.scene{min-height:210px;background:linear-gradient(#c5e9ff 0 60%,#a9dfb0 60%);border-radius:24px;display:grid;place-items:center;font-size:105px;margin:20px 0}.tabs{display:flex;flex-wrap:wrap;gap:8px}.tabs button{font-size:17px;background:#e7efff;color:#244a9d}.tabs button.active{background:var(--blue);color:white}.flip{height:300px;perspective:900px;cursor:pointer}.inner{height:100%;position:relative;transform-style:preserve-3d;transition:transform .55s}.flip.flipped .inner{transform:rotateY(180deg)}.face{position:absolute;inset:0;backface-visibility:hidden;background:#f1f6ff;border:2px solid #e1e9ff;border-radius:22px;display:flex;align-items:center;justify-content:center;flex-direction:column;text-align:center;padding:17px}.face.back{transform:rotateY(180deg);background:#e8fff5;border-color:#91dbb7}.pic{font-size:72px}.word{font-size:28px;font-weight:900;margin:10px 0}.meaning{font-size:22px;color:#285a9c}.hint{font-size:16px;color:#66768b;margin-top:12px}.example{font-size:24px;font-weight:750;line-height:1.45}.prompt{font-size:28px;font-weight:850;line-height:1.5;margin:20px 0}.order-list{display:grid;gap:10px;margin:20px 0}.order-item{display:flex;align-items:center;gap:12px;padding:12px;background:#f2f6ff;border:2px solid #dce7fc;border-radius:15px;font-size:20px;line-height:1.4}.order-item.dragging{opacity:.45}.order-item .num{font-weight:900;color:#3269e9;font-size:23px;min-width:25px}.order-item .words{flex:1}.order-item .moves{display:flex;gap:5px}.order-item button{font-size:18px;padding:7px 11px}.compare{display:grid;grid-template-columns:repeat(auto-fit,minmax(310px,1fr));gap:18px}.essay{background:#f2f6ff;border-radius:20px;padding:23px;font-size:21px;line-height:1.8}.essay h3{margin:0 0 10px;font-size:27px}.pink{background:#ffe0ef;color:#af206f;font-weight:800;padding:0 3px;border-radius:4px}.cyan{background:#dceeff;color:#135aab;font-weight:800;padding:0 3px;border-radius:4px}.green{background:#dcf8e7;color:#137b53;font-weight:800;padding:0 3px;border-radius:4px}.rating button{padding:7px 9px;background:#e7ebf7;color:#a4a9b5;font-size:27px}.rating button.on{background:#fff2bd;color:#d99900}.field{width:100%;min-height:250px;border:3px solid #d8e5fc;border-radius:20px;padding:20px;font-size:23px;line-height:1.65;resize:vertical;color:var(--ink)}.pill{display:inline-block;border-radius:999px;background:#e7f0ff;padding:8px 14px;margin:5px;font-size:19px}.check{display:flex;align-items:flex-start;gap:12px;font-size:20px;margin:12px 0}.check input{width:22px;height:22px}.teacher{position:fixed;bottom:20px;right:20px;background:#7953dd;color:white;box-shadow:0 8px 26px #372a7555;z-index:10}.overlay{position:fixed;inset:0;background:#162440aa;display:none;align-items:center;justify-content:center;padding:18px;z-index:20}.overlay.open{display:flex}.modal{width:min(720px,100%);max-height:94vh;overflow:auto;border-radius:26px;background:#fff;padding:27px;text-align:center}.winner{min-height:110px;border-radius:20px;background:#e8efff;display:grid;place-items:center;font-size:clamp(27px,5vw,44px);font-weight:900;margin:17px 0}.modal li{text-align:left;line-height:1.8;font-size:17px}.called{text-decoration:line-through;color:#9ba4b2}@media(max-width:650px){.panel{padding:20px}.wrap{padding:12px 12px 95px}.hero{padding:22px}.hero .art{display:none}.order-item{font-size:17px}.order-item button{padding:6px 9px}}

</style></head><body><main class="wrap"><header class="hero"><div><b>✏️ WRITING ADVENTURE • GRADE 4–5</b><h1>My Dream House 🏡</h1><p>Imagine • Build sentences • Connect ideas • Write!</p></div><div class="art">🏡🌷</div></header><div class="progress"><div id="bar"></div></div><nav class="nav" id="nav"></nav><section class="panel" id="screen"></section></main><button class="teacher" onclick="openPicker()">🎲 Gọi học sinh</button><div class="overlay" id="overlay" onclick="if(event.target===this)closePicker()"><div class="modal"><div class="row" style="justify-content:space-between"><h2>🎲 Random Student Call</h2><button class="secondary" onclick="closePicker()">✕</button></div><p>Chọn ngẫu nhiên, không lặp lại trong một lượt.</p><div class="winner" id="winner">Sẵn sàng chưa? 🌟</div><div class="row" style="justify-content:center"><button id="spinBtn" class="primary" onclick="spin()">🎯 QUAY TÊN</button><button class="secondary" onclick="resetNames()">🔄 Làm mới lượt</button></div><p id="counter"></p><details><summary>📋 Danh sách 15 học sinh</summary><ol id="roster"></ol></details></div></div><script>
const vocab={"Rooms": [["living room", "(n) phòng khách", "Our living room has a big sofa.", "🛋️"], ["bedroom", "(n) phòng ngủ", "My bedroom is on the top floor.", "🛏️"], ["kitchen", "(n) nhà bếp", "There is a modern kitchen.", "🍳"], ["bathroom", "(n) phòng tắm", "The bathroom has a large mirror.", "🛁"], ["library", "(n) thư viện", "There is a library for my books.", "📚"], ["playroom", "(n) phòng vui chơi", "My playroom is full of toys.", "🧸"]], "Outside": [["garden", "(n) khu vườn", "The garden is full of flowers.", "🌷"], ["balcony", "(n) ban công", "I can see the sea from my balcony.", "🏡"], ["roof", "(n) mái nhà", "The roof is red.", "🏠"], ["swimming pool", "(n) hồ bơi", "There is a small swimming pool.", "🏊"], ["big windows", "(n phr) những cửa sổ lớn", "My house has big windows.", "🪟"]], "Things": [["sofa", "(n) ghế sofa", "There is a comfortable sofa.", "🛋️"], ["TV", "(n) ti vi", "We watch TV in the living room.", "📺"], ["bookshelf", "(n) giá sách", "My bookshelf is full of books.", "📚"], ["computer", "(n) máy tính", "I have a computer in my room.", "💻"], ["robot", "(n) rô-bốt", "A robot cleans my room.", "🤖"]], "Places": [["by the sea", "(phr) bên bờ biển", "My dream house is by the sea.", "🏖️"], ["in the mountains", "(phr) trên vùng núi", "My dream house is in the mountains.", "🏔️"], ["in the city", "(phr) trong thành phố", "My dream house is in the city.", "🏙️"]], "B1 words ★": [["spacious", "(adj) rộng rãi", "The living room is spacious.", "🏠"], ["modern", "(adj) hiện đại", "It is a modern house.", "✨"], ["comfortable", "(adj) thoải mái", "The sofa is comfortable.", "🛋️"], ["relax", "(v) thư giãn", "I relax in the garden.", "🧘"], ["unique", "(adj) độc đáo", "My dream house has a unique design.", "💎"], ["view", "(n) quang cảnh, tầm nhìn", "The view is beautiful.", "🌄"]], "B1 phrases ★": [["be full of", "(phr) đầy ắp", "The house is full of books.", "📚"], ["have a view of", "(phr) có tầm nhìn ra", "My room has a view of the sea.", "🌊"], ["feel at home", "(phr) cảm thấy như ở nhà", "I feel at home there.", "💗"]]},questions=[["I want a library ___ I love reading.", ["because", "but", "therefore"], 0, "Because introduces a reason."], ["The house is big, ___ it is cosy.", ["so", "but", "because"], 1, "But shows contrast."], ["I love swimming, ___ I want a pool.", ["so", "although", "because of"], 0, "So introduces a result."], ["The house is spacious. ___, it feels comfortable.", ["Therefore", "Because", "But"], 0, "Therefore starts a new sentence and takes a comma."], ["The house is modern. ___, it has a traditional garden.", ["However", "So", "Because"], 0, "However shows contrast between sentences."], ["___, you walk into a big living room. Then, you see the kitchen.", ["First", "However", "Because"], 0, "First introduces the first step."]],builds=[["Choose the correct sentence.", ["There is a library and there are two bedrooms.", "There are a library and there is two bedrooms.", "There is two bedrooms and a library."], 0, "There is + singular; there are + plural."], ["Choose the best reason.", ["I want a pool because I love swimming.", "I want a pool but I love swimming.", "I want a pool therefore I love swimming."], 0, "Because + subject + verb."], ["Choose the correct sentence.", ["The house are full of books.", "The house is full of books.", "The house full of books."], 1, "The house is + adjective phrase."], ["Choose the correct punctuation.", ["It is small. However, it is comfortable.", "It is small, However it is comfortable.", "It is small however, it is comfortable."], 0, "However starts a new sentence with a comma."], ["Choose the best closing sentence.", ["I love my dream house, so I want to live there.", "I love my dream house because I want a pool so.", "I love my dream house but I am happy there because."], 0, "A closing sentence should express a clear final feeling."]],exercises=[{"title": "Exercise 1 · Clear linking words", "items": {"A": "In conclusion, my dream house is a lovely place, and I want to live there with my family.", "B": "Secondly, the house has many fun rooms.", "C": "There are colourful flowers, tall trees and a small swimming pool.", "D": "My dream house is a big white house near the sea.", "E": "Finally, I can see the sea from my window, so I feel happy every morning.", "F": "I have got a big bedroom with a comfy bed, and there is a library for my favourite books.", "G": "Firstly, it has a beautiful garden."}, "answer": ["D", "G", "C", "B", "F", "E", "A"]}, {"title": "Exercise 2 · Smooth transitions", "items": {"A": "Therefore, my dream house is not only big and beautiful but also full of love, and I hope to live there one day.", "B": "My bedroom is on the top floor, and I can see the beautiful sea from my window.", "C": "My dream house is a big white house near the sea.", "D": "However, I don't want to live alone, so my family and my pets live with me.", "E": "Because the weather is warm there, the house has a large garden with colourful flowers and a small swimming pool.", "F": "Besides playing outside, I can read my favourite books in a quiet library inside."}, "answer": ["C", "E", "F", "B", "D", "A"]}],students=["Nguyễn Hà Vy", "Phạm Nguyễn Thiên Phúc", "Bùi Tùng Anh", "Nguyễn Lê Minh Ngọc", "Phạm Tú Anh", "Lê Hải Bình", "Trần Thùy An", "Trương Minh Khang", "Phạm An Nhiên", "Phan Quỳnh Anh", "Trương Gia Hân", "Đỗ Ngọc Khánh", "Hoài An", "Nguyễn Tuệ Lâm", "Khánh Chi"];
const steps=['Welcome','Dream Homes','Words','Linking','Build','Order 1','Order 2','Compare','Write','Finish'];
let page=0,home=0,cat=0,qi=0,qs=null,qchecked=false,bi=0,bs=null,bchecked=false,orders=[null,null],orderFeedback=[null,null],reveal=false,ratings={a:0,b:0};
const homes=[{name:'By the sea',icon:'🏖️🏡',text:'I can see the sea from my window.'},{name:'In the mountains',icon:'🏔️🏡',text:'I can enjoy the beautiful mountain view.'},{name:'In the city',icon:'🏙️🏡',text:'My house is close to many shops.'}];
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function go(n){page=n;render();window.scrollTo({top:0,behavior:'smooth'})}
function layout(title,lead,body){return `<div class="eyebrow">MISSION ${page+1} OF ${steps.length}</div><h2>${title}</h2><p class="lead">${lead}</p>${body}`}
function render(){document.getElementById('bar').style.width=((page+1)/steps.length*100)+'%';document.getElementById('nav').innerHTML=steps.map((s,i)=>`<button class="${page===i?'active':''}" onclick="go(${i})">${s}</button>`).join('');if(page===0)welcome();if(page===1)dreamHomes();if(page===2)words();if(page===3||page===4)quiz();if(page===5||page===6)ordering();if(page===7)compare();if(page===8)write();if(page===9)finish()}
function welcome(){document.getElementById('screen').innerHTML=layout('Welcome to My Dream House! 🌈','Your mission: Write a paragraph about your dream house. Use at least THREE linking words.',`<div class="scene">🏡🌳🌷</div><div class="note"><b>Today’s adventure:</b> Choose a dream home → Discover words → Connect ideas → Build sentences → Put two paragraphs in order → Compare writing → Write your own paragraph.</div><button class="primary" onclick="go(1)">Start adventure →</button>`)}
function dreamHomes(){const h=homes[home];document.getElementById('screen').innerHTML=layout('Imagine Your Dream House! 💭','Where would you like to live? Choose a location and describe your dream house.',`<div class="tabs">${homes.map((x,i)=>`<button class="${home===i?'active':''}" onclick="home=${i};dreamHomes()">${x.name}</button>`).join('')}</div><div class="scene">${h.icon}</div><div class="feedback"><b>My dream house is ${h.name.toLowerCase()}.</b><br>${h.text}</div><p class="lead">Think: What does it look like? What rooms and special things does it have? Who lives there?</p><button class="primary" onclick="go(2)">Explore vocabulary →</button>`)}
const b1Pronunciations={"spacious": "/ˈspeɪʃəs/", "modern": "/ˈmɒdən/", "comfortable": "/ˈkʌmftəbl/", "relax": "/rɪˈlæks/", "unique": "/juˈniːk/", "view": "/vjuː/", "be full of": "/biː fʊl əv/", "have a view of": "/hæv ə vjuː əv/", "feel at home": "/fiːl ət həʊm/"};
function words(){const key=Object.keys(vocab)[cat];document.getElementById('screen').innerHTML=layout('Vocabulary Explorer 🧠','Nhấn vào thẻ để lật xem ví dụ. Nhấn lần nữa để lật về mặt trước.',`<div class="tabs">${Object.keys(vocab).map((k,i)=>`<button class="${cat===i?'active':''}" onclick="cat=${i};words()">${k}</button>`).join('')}</div><div class="cards">${vocab[key].map(([w,m,e,ic])=>`<div class="flip" tabindex="0" role="button" aria-label="Lật thẻ ${esc(w)}" onclick="this.classList.toggle('flipped')" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();this.click()}"><div class="inner"><div class="face"><div class="pic">${ic}</div><div class="word">${esc(w)}</div>${b1Pronunciations[w]?`<div class="ipa">${b1Pronunciations[w]}</div>`:""}<div class="meaning">${esc(m)}</div><div class="hint">👆 Nhấn để xem ví dụ</div></div><div class="face back"><div class="word">${esc(w)}</div><div class="example">${esc(e)}</div><div class="hint">↩ Nhấn để lật lại</div></div></div></div>`).join('')}</div><div class="note">⭐ Challenge: Use <b>spacious, modern, comfortable, unique</b> and phrases such as <b>be full of, have a view of, feel at home</b>.</div><button class="primary" onclick="go(3)">Linking Words Lab →</button>`)}
function quiz(){const link=page===3,list=link?questions:builds,i=link?qi:bi,s=link?qs:bs,checked=link?qchecked:bchecked,q=list[i];document.getElementById('screen').innerHTML=layout(link?'Linking Words Lab 🔗':'Sentence Builder 🧩',link?'Choose the best linking word to connect the ideas.':'Choose the sentence that is correct and clear.',`<div class="eyebrow">CHALLENGE ${i+1} / ${list.length}</div><div class="prompt">${esc(q[0])}</div><div class="cards">${q[1].map((a,j)=>`<button class="choice ${s===j?'sel':''} ${checked&&s===j?(s===q[2]?'ok':'bad'):''}" onclick="choose(${j})">${esc(a)}</button>`).join('')}</div><div id="quizResult">${checked?quizResult():''}</div><div class="row"><button class="primary" onclick="checkQuiz()">Check answer ✓</button><button class="secondary" onclick="restartQuiz()">Restart</button></div>${link?'<div class="note"><b>Linking words:</b> First / Then / Also / Finally (order); and / besides (add); but / however (contrast); because (reason); so / therefore (result).<br><b>Tip:</b> However, and Therefore, often begin a new sentence.</div>':''}`)}
function choose(j){if(page===3){qs=j;qchecked=false}else{bs=j;bchecked=false}quiz()}
function quizResult(){const link=page===3,q=(link?questions:builds)[link?qi:bi],s=link?qs:bs,ok=s===q[2];return `<div class="feedback">${ok?'🌟 Correct! ':'💡 Try again. '}${esc(q[3])} ${ok?'<button class="primary" onclick="nextQuiz()">Next →</button>':''}</div>`}
function checkQuiz(){const s=page===3?qs:bs;if(s===null)return alert('Hãy chọn một đáp án!');if(page===3)qchecked=true;else bchecked=true;document.getElementById('quizResult').innerHTML=quizResult()}
function nextQuiz(){if(page===3){if(qi<questions.length-1){qi++;qs=null;qchecked=false;quiz()}else go(4)}else{if(bi<builds.length-1){bi++;bs=null;bchecked=false;quiz()}else go(5)}}
function restartQuiz(){if(page===3){qi=0;qs=null;qchecked=false}else{bi=0;bs=null;bchecked=false}quiz()}
function currentOrderIndex(){return page-5}
function ensureOrder(k){if(!orders[k])orders[k]=Array(exercises[k].answer.length).fill(null)}
let pickedLetter=null;
function ordering(){
 const k=currentOrderIndex(),ex=exercises[k];ensureOrder(k);
 const slots=orders[k],letters=Object.keys(ex.items),allFilled=slots.every(Boolean),isCorrect=allFilled&&slots.every((v,i)=>v===ex.answer[i]);
 const stateClass=(id)=>!allFilled?'placed':(ex.answer[slots.indexOf(id)]===id?'right':'wrong');
 document.getElementById('screen').innerHTML=layout('Sentence Ordering 🧩',`Exercise ${k+1}: Kéo chữ cái vào từng ô trống để tạo đoạn văn. Khi điền, các câu phía trên sẽ tự sắp xếp theo lựa chọn của em.`,
 `<div class="note"><b>${esc(ex.title)}</b><br>Read the sentences A–${letters[letters.length-1]}. Find the topic sentence, details, linking words and conclusion.</div>
 <div class="order-label">📖 Sentences A–${letters[letters.length-1]}</div>
 <div class="order-source" id="orderSource">${[...slots.filter(Boolean),...letters.filter(x=>!slots.includes(x))].map(id=>`<div class="order-source-item ${slots.includes(id)?stateClass(id):''}"><span class="letter">${id}.</span>${esc(ex.items[id])}</div>`).join('')}</div>
 <div class="order-label">🧩 Put the letters in order</div>
 <div class="order-help">Drag a letter to a blank. Or tap a letter, then tap a blank. Tap a filled blank to remove its letter.</div>
 <div class="order-slots">${slots.map((id,i)=>`<div class="order-slot ${id?'filled':''} ${allFilled?(id===ex.answer[i]?'right':'wrong'):''}" role="button" tabindex="0" aria-label="Position ${i+1}${id?', letter '+id:', empty'}" ondragover="event.preventDefault()" ondrop="dropLetter(event,${i})" onclick="tapSlot(${i})" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();tapSlot(${i})}"><span>${i+1}.</span><span>${id||'_____ '}</span></div>`).join('')}</div>
 <div class="order-label">🔤 Drag these letters</div>
 <div class="order-bank">${letters.map(id=>`<button class="order-token ${pickedLetter===id?'chosen':''}" draggable="${!slots.includes(id)}" ${slots.includes(id)?'disabled':''} ondragstart="dragLetter(event,'${id}')" onclick="pickLetter('${id}')">${id}</button>`).join('')}</div>
 <div id="orderResult">${orderFeedback[k]||''}</div>
 <div class="row"><button class="primary" onclick="checkOrder()">Check order ✓</button><button class="secondary" onclick="showOrder()">Reveal answer</button><button class="secondary" onclick="resetOrder()">Restart</button></div>
 <div class="row" style="margin-top:18px"><button class="primary" onclick="go(${k===0?6:7})">${k===0?'Exercise 2':'Compare paragraphs'} →</button></div>`);
}
function dragLetter(e,id){e.dataTransfer.effectAllowed='move';e.dataTransfer.setData('text/plain',id)}
function dropLetter(e,i){e.preventDefault();const id=e.dataTransfer.getData('text/plain');if(id&&Object.hasOwn(exercises[currentOrderIndex()].items,id))putLetter(id,i)}
function pickLetter(id){const k=currentOrderIndex();if(orders[k].includes(id))return;pickedLetter=id;ordering()}
function tapSlot(i){const k=currentOrderIndex();if(pickedLetter){putLetter(pickedLetter,i)}else if(orders[k][i]){orders[k][i]=null;orderFeedback[k]=null;ordering()}}
function putLetter(id,i){const k=currentOrderIndex(),a=orders[k];if(!Object.hasOwn(exercises[k].items,id))return;const old=a.indexOf(id);if(old>=0)a[old]=null;a[i]=id;pickedLetter=null;orderFeedback[k]=null;if(a.every(Boolean)){const good=a.every((x,j)=>x===exercises[k].answer[j]);orderFeedback[k]=`<div class="feedback">${good?'🎉 Excellent! All sentences are in the correct order.':'🔴 Not quite yet! Red means the sentence is in the wrong position. Tap a slot to remove its letter and try again.'}</div>`}ordering()}
function checkOrder(){const k=currentOrderIndex(),a=orders[k],answer=exercises[k].answer;if(a.some(x=>!x)){orderFeedback[k]='<div class="feedback">💡 Fill all the blanks first!</div>'}else{const good=a.every((x,i)=>x===answer[i]);orderFeedback[k]=`<div class="feedback">${good?'🎉 Correct! The paragraph is well organised.':'🔴 Some positions are incorrect. Look at the linking words and try again.'}</div>`}ordering()}
function showOrder(){const k=currentOrderIndex(),e=exercises[k];orders[k]=[...e.answer];pickedLetter=null;orderFeedback[k]=`<div class="feedback">✅ <b>Answer key:</b> ${e.answer.join(' → ')}<br>The topic sentence comes first, then supporting details, and finally the conclusion.</div>`;ordering()}
function resetOrder(){const k=currentOrderIndex();orders[k]=Array(exercises[k].answer.length).fill(null);pickedLetter=null;orderFeedback[k]=null;ordering()}
function rate(k,n){ratings[k]=n;compare()}function stars(k){return [1,2,3,4,5].map(n=>`<button class="${ratings[k]>=n?'on':''}" onclick="rate('${k}',${n})" aria-label="${n} stars">★</button>`).join('')}
function compare(){const a='My dream house is near the sea. It is big. It is white. It has a garden. It has a pool. I have a bedroom. I have a library. I like my house.';const b='My dream house is a <span class="green">spacious</span> white house by the sea <span class="pink">because</span> I love the ocean. <span class="pink">Firstly,</span> it has a beautiful garden <span class="pink">and</span> a small swimming pool. <span class="pink">Besides,</span> my bedroom <span class="green">has a view of</span> the sea. The house is <span class="cyan">more comfortable than</span> my current home. <span class="pink">Although</span> it is large, it feels <span class="green">cosy</span>. <span class="pink">Because of</span> its <span class="green">peaceful view</span>, I can relax there. <span class="pink">Therefore,</span> I hope to live there with my family one day.';document.getElementById('screen').innerHTML=layout('Writing Detective 🔍','Compare two paragraphs. Score each from 1 to 5 stars, then reveal the colour codes.',`<div class="compare"><div class="essay"><h3>📝 Paragraph A</h3>${a}<p><b>Your score:</b></p><div class="rating">${stars('a')}</div></div><div class="essay"><h3>✨ Paragraph B</h3>${reveal?b:b.replace(/<[^>]*>/g,'')}<p><b>Your score:</b></p><div class="rating">${stars('b')}</div></div></div><div class="row" style="margin-top:20px"><button class="primary" onclick="reveal=!reveal;compare()">${reveal?'Hide colour codes':'Reveal colour codes & analysis'} 🎨</button><button class="secondary" onclick="go(8)">Start writing →</button></div>${reveal?'<div class="note"><b>Colour key:</b> <span class="pink">Pink: linking words</span> • <span class="cyan">Blue: comparison</span> • <span class="green">Green: vivid words and phrases</span><br><b>Why is B stronger?</b> It connects ideas, explains reasons and gives specific details.<br><b>Challenge grammar:</b> because + clause; because of + noun phrase; although + clause; despite + noun phrase / V-ing. Example: <i>Despite its size, the house feels cosy.</i></div>':''}<div class="note">Paragraph A is clear but repetitive. Paragraph B uses richer language. These ratings are for class discussion, not automatic marks.</div>`)}
const draftKey='dream_house_writing_v1';function write(){const saved=localStorage.getItem(draftKey)||'';document.getElementById('screen').innerHTML=layout('My Writing Studio ✍️','Write a paragraph about your dream house. Use at least THREE linking words.',`<div class="note"><b>Plan your paragraph:</b> Where is it? What does it look like outside? What rooms are there? What special things are there? Who lives there? Why do you love it?</div><div class="tabs"><button onclick="level('support')">🟢 Support</button><button onclick="level('standard')">🔵 Standard</button><button onclick="level('challenge')">⭐ Challenge</button></div><div class="note" id="level">Choose a level for a writing guide.</div><p><b>Useful words:</b> <span class="pill">First</span><span class="pill">Then</span><span class="pill">Also</span><span class="pill">because</span><span class="pill">but</span><span class="pill">so</span><span class="pill">However</span><span class="pill">Therefore</span></p><textarea class="field" id="draft" placeholder="My dream house is ..." oninput="saveDraft()">${esc(saved)}</textarea><p id="stats" class="lead"></p><div class="row"><button class="primary" onclick="checkWriting()">Check my writing ✓</button><button class="secondary" onclick="go(9)">Finish →</button></div><div id="writingResult"></div>`);updateStats()}
function level(x){document.getElementById('level').innerHTML=x==='support'?'<b>Support:</b> My dream house is ___. It is ___. First, there is ___. Then, there are ___. I want ___ because ___. It is ___, but ___. I love ___, so ___.':x==='standard'?'<b>Standard:</b> Include location, outside, rooms, special things, people and your feelings. Use at least three linking words.':'<b>Challenge ★:</b> Try however and therefore, at least two B1 words or phrases, and a comparison if you can.'}
function saveDraft(){localStorage.setItem(draftKey,document.getElementById('draft').value);updateStats()}
function getStats(){const t=document.getElementById('draft').value.trim(),words=t?t.split(/\s+/).length:0,sentences=(t.match(/[.!?]+(?=\s|$)/g)||[]).length,links=(t.match(/\b(first|then|also|finally|and|besides|but|however|because|so|therefore|although|despite)\b/gi)||[]).length;return {t,words,sentences,links}}
function updateStats(){const s=getStats();document.getElementById('stats').textContent=`${s.words} words • ${s.sentences} sentences • ${s.links} linking-word uses (target ≥3)`}
function checkWriting(){const s=getStats();document.getElementById('writingResult').innerHTML=`<div class="feedback"><b>Writing checklist (automatic hints):</b><br>${s.sentences>=5?'✅':'⬜'} 5 or more sentences<br>${s.links>=3?'✅':'⬜'} At least 3 linking-word uses<br>${/\bbecause\b/i.test(s.t)?'✅':'⬜'} A reason with because<br>${/\b(but|however)\b/i.test(s.t)?'✅':'⬜'} Contrast with but / however<br>${/\b(so|therefore)\b/i.test(s.t)?'✅':'⬜'} Result with so / therefore<br>${/\b(spacious|modern|comfortable|unique|view|relax)\b/i.test(s.t)?'✅':'⬜'} B1 vocabulary<br><small>Teacher should check accuracy, ideas, grammar, punctuation and whether linking words are used correctly.</small></div>`}
function finish(){document.getElementById('screen').innerHTML=layout('Dream House Achievement! 🏆','You have learned to describe a dream house and connect your ideas.',`<div class="scene">🏆🏡🌈</div><div class="note"><b>Final checklist</b><label class="check"><input type="checkbox"> I said where my dream house is.</label><label class="check"><input type="checkbox"> I described the outside and rooms.</label><label class="check"><input type="checkbox"> I explained a special thing using because.</label><label class="check"><input type="checkbox"> I used at least three linking words.</label><label class="check"><input type="checkbox"> I checked capital letters, spelling and full stops.</label></div><div class="row"><button class="primary" onclick="go(8)">Review my writing ✍️</button><button class="secondary" onclick="go(0)">Back to Home</button></div>`)}
let remaining=[...students],called=[],timer=null;function openPicker(){document.getElementById('overlay').classList.add('open');roster()}function closePicker(){document.getElementById('overlay').classList.remove('open')}function roster(){document.getElementById('counter').textContent=`Đã gọi: ${called.length}/15 • Còn lại: ${remaining.length}`;document.getElementById('roster').innerHTML=students.map(s=>`<li class="${called.includes(s)?'called':''}">${esc(s)}</li>`).join('')}function rand(n){if(window.crypto&&crypto.getRandomValues){let a=new Uint32Array(1);crypto.getRandomValues(a);return a[0]%n}return Math.floor(Math.random()*n)}function spin(){if(timer)return;if(!remaining.length){alert('Đã gọi hết 15 bạn. Hãy làm mới lượt!');return}const btn=document.getElementById('spinBtn'),w=document.getElementById('winner');btn.disabled=true;let count=0;timer=setInterval(()=>{w.textContent=remaining[rand(remaining.length)];if(++count===19){clearInterval(timer);timer=null;const s=remaining.splice(rand(remaining.length),1)[0];called.push(s);w.textContent='🎉 '+s+' 🎉';btn.disabled=false;roster()}},75)}function resetNames(){if(timer){clearInterval(timer);timer=null}document.getElementById('spinBtn').disabled=false;remaining=[...students];called=[];document.getElementById('winner').textContent='Sẵn sàng chưa? 🌟';roster()}document.addEventListener('keydown',e=>{if(e.key==='Escape')closePicker()});render();
</script></body></html>
